name: Atualizar novidades

on:
  schedule:
    - cron: "0 9,15,21 * * *"   # 06h, 12h e 18h (Brasilia)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar novidades
        run: python scripts/atualizar.py
      - name: Publicar alteracao
        run: |
          git config user.name "qg-bot"
          git config user.email "qg-bot@users.noreply.github.com"
          git add novidades.json
          git diff --cached --quiet || (git commit -m "Atualizacao automatica das novidades" && git push)
