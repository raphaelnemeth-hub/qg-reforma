name: Atualizar novidades

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar novidades
        run: python scripts/atualizar.py
      - name: Publicar alteracao
        run: |
          git config user.name "qg-bot"
          git config user.email "qg-bot@users.noreply.github.com"
          git add novidades.json feed.xml
          git diff --cached --quiet || (git commit -m "Atualizacao automatica das novidades" && git push)
      - name: Alerta por e-mail (Issue do GitHub)
        if: hashFiles('novos.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="Novas materias da reforma tributaria ($(TZ=America/Sao_Paulo date +'%d/%m %H:%M'))"
          gh issue create --title "$TITULO" --body-file novos.md
